<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprout Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b3a2f;--card:#fffaf0;--line:#2b3a2f;--leaf:#6bcb77;--sky:#4aa8e0;--gold:#ffd23f;--pink:#ff8fab;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f4f0e2;--card:#2c3a32;--line:#0f1a14}}
:root[data-theme="dark"]{--ink:#f4f0e2;--card:#2c3a32;--line:#0f1a14}
html,body{height:100%;margin:0;overflow:hidden;background:#bfe9ff;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;padding:0 12px;pointer-events:none}
.pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;font-size:20px;box-shadow:0 3px 0 var(--line)}
.pill.sm{font-size:13px;font-weight:500;padding:6px 12px}
#panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--line)}
#ttl{font-weight:700;font-size:19px;margin-bottom:6px}
.bar{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.bar i{display:block;height:14px;border:2.5px solid var(--line);border-radius:9px;overflow:hidden;background:rgba(0,0,0,.12)}
.bar b{display:block;height:100%;width:0;transition:width .2s}
#bg{background:var(--leaf)}#bw{background:var(--sky)}
#btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;max-height:150px;overflow-y:auto}
button{flex:1;min-width:92px;font:700 15px 'Fredoka',system-ui,sans-serif;color:#2b3a2f;border:3px solid var(--line);border-radius:14px;padding:9px 6px;box-shadow:0 3px 0 var(--line);cursor:pointer;background:#fff}
button:active{transform:translateY(3px);box-shadow:none}
button:disabled{opacity:.45;cursor:default}
.hide{display:none!important}
.w{background:#8fd3ff}.f{background:#c9a6ff}.h{background:var(--gold)}.s{background:#b9f0b0;flex:1 1 21%;min-width:0;font-size:12px;padding:6px 2px;white-space:pre-line;line-height:1.15}
#stick{position:fixed;left:18px;bottom:calc(250px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.45);border:3px solid var(--line);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--card);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);pointer-events:none}
#hint{max-width:62vw;text-align:right;white-space:normal;font-size:12px;line-height:1.2}
#ev{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));white-space:nowrap;pointer-events:none}
#msg{position:fixed;left:0;right:0;top:calc(104px + env(safe-area-inset-top,0px));text-align:center;font-weight:700;font-size:18px;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 2px 0 #fff}
#skyb{position:fixed;left:12px;top:calc(58px + env(safe-area-inset-top,0px));min-width:0;flex:none;width:46px;height:46px;border-radius:50%;padding:0;font-size:22px;background:var(--card)}
.scr{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(20,40,30,.55);backdrop-filter:blur(6px)}
.scr.on{display:flex}#ld{background:linear-gradient(#bfe9ff,#8fd96b);z-index:60}
.scr h1,.scr h2{margin:0 0 8px;font-size:40px;color:#fff;-webkit-text-stroke:2px var(--line);paint-order:stroke fill;text-shadow:0 4px 0 var(--line);text-align:center;animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
.scr button{width:min(300px,80vw);flex:none;font-size:20px;padding:12px;animation:up .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--n,0)*80ms + 150ms)}
.scr input{width:min(300px,80vw);box-sizing:border-box;font:500 18px Fredoka,system-ui,sans-serif;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
#lst,#pt,#ltip{color:#fff;font-weight:500;text-align:center;max-width:80vw}#ltip{color:#2b3a2f;font-weight:700}
.bar2{width:min(300px,70vw);height:22px;border:3px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:var(--leaf)}
.g{background:var(--leaf)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}@keyframes up{from{transform:translateY(40px) scale(.9);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}
#tr{position:fixed;inset:0;z-index:99;background:#2b3a2f;display:flex;align-items:center;justify-content:center;font-size:64px;clip-path:circle(0 at 50% 50%);pointer-events:none}
#tr.on{clip-path:circle(80% at 50% 50%);transition:clip-path .45s cubic-bezier(.6,0,.9,.4)}#tr.off{clip-path:circle(0 at 50% 50%);transition:clip-path .5s cubic-bezier(.1,.6,.4,1)}
#tr span{display:inline-block;animation:spin .9s linear infinite}
#pz{position:fixed;left:66px;top:calc(58px + env(safe-area-inset-top,0px));min-width:0;flex:none;width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;background:var(--card)}
#plist{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top,0px));white-space:pre;text-align:left;pointer-events:none;line-height:1.4}
body.menu #top,body.menu #panel,body.menu #stick,body.menu #skyb,body.menu #pz,body.menu #plist,body.menu #ev,body.menu #msg{display:none!important}
</style></head><body>

<div id="msg"></div>

<div id="btns"></div></div>
<div id="ld" class="scr on"><h1>🌱 Sprout Garden</h1><div class="bar2"><i id="lbar"></i></div><div id="ltip">Loading…</div></div>
<div id="mn" class="scr"><h1>🌱 Sprout Garden</h1><button class="h" id="bSolo">▶ Solo Garden</button><button class="w" id="bMulti">👥 Multiplayer</button></div>
